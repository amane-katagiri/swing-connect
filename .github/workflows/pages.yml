name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node build.mjs dist
        env:
          SWING_CONNECT_THEME: ${{ vars.SWING_CONNECT_THEME }}
          SWING_CONNECT_TITLE: ${{ vars.SWING_CONNECT_TITLE }}
          SWING_CONNECT_DESCRIPTION: ${{ vars.SWING_CONNECT_DESCRIPTION }}
          SWING_CONNECT_NIP05: ${{ vars.SWING_CONNECT_NIP05 }}
          SWING_CONNECT_LIGHT_COLOR: ${{ vars.SWING_CONNECT_LIGHT_COLOR }}
          SWING_CONNECT_DARK_COLOR: ${{ vars.SWING_CONNECT_DARK_COLOR }}
          SWING_CONNECT_CUSTOM_COLORS: ${{ vars.SWING_CONNECT_CUSTOM_COLORS }}
          SWING_CONNECT_ALLOWED_KEYS: ${{ vars.SWING_CONNECT_ALLOWED_KEYS }}
          SWING_CONNECT_SWING_URL: ${{ vars.SWING_CONNECT_SWING_URL }}
          SWING_CONNECT_BANNERS: ${{ vars.SWING_CONNECT_BANNERS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
