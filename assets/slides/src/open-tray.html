<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>tray menu</title>
<style>
@font-face{font-family:"PixelMplus12";src:url("fonts/pixelmplus12-regular.woff2") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"PixelMplus12";src:url("fonts/pixelmplus12-bold.woff2") format("woff2");font-weight:700;font-display:block}
:root{--face:#c0c0c0;--hi:#fff;--sh:#808080;--dk:#000;--wall:#544a86;--sel:#000080}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--wall) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8' shape-rendering='crispEdges'><rect width='8' height='8' fill='%23544a86'/><g fill='%23675ca0'><rect x='0' y='0' width='1' height='1'/><rect x='1' y='1' width='1' height='1'/><rect x='7' y='1' width='1' height='1'/><rect x='2' y='2' width='1' height='1'/><rect x='6' y='2' width='1' height='1'/><rect x='3' y='3' width='1' height='1'/><rect x='5' y='3' width='1' height='1'/><rect x='4' y='4' width='1' height='1'/><rect x='3' y='5' width='1' height='1'/><rect x='5' y='5' width='1' height='1'/><rect x='2' y='6' width='1' height='1'/><rect x='6' y='6' width='1' height='1'/><rect x='1' y='7' width='1' height='1'/><rect x='7' y='7' width='1' height='1'/></g></svg>") 0 0/16px 16px;image-rendering:pixelated;color:#000;-webkit-font-smoothing:none;font-smooth:never}
.screen{zoom:2;position:relative;width:640px;height:400px;font:12px/1 "PixelMplus12",monospace;image-rendering:pixelated}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:28px;background:var(--face);box-shadow:inset 0 1px 0 var(--face),inset 0 2px 0 var(--hi);display:flex;align-items:center;gap:4px;padding:4px 2px 2px}
.start{display:flex;align-items:center;gap:4px;height:22px;padding:0 6px 0 4px;font-weight:700;box-shadow:inset -1px -1px 0 var(--dk),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--sh)}
.start i{width:16px;height:16px;background:conic-gradient(#e0332f 0 25%,#2f8f3f 0 50%,#2b6cd0 0 75%,#ffcc33 0)}
.tray{margin-left:auto;height:22px;display:flex;align-items:center;gap:4px;padding:0 6px 0 4px;box-shadow:inset 1px 1px 0 var(--sh),inset -1px -1px 0 var(--hi)}
.tray img{width:16px;height:16px;display:block;image-rendering:auto}
.tray .ic{width:16px;height:16px;background:#404040;box-shadow:inset 0 0 0 2px #808080}
.tray .ic.net{background:#2b6cd0}
.tray .ic.vol{background:#808080}
.tray .clock{margin-left:4px}
.menu{position:absolute;right:28px;bottom:28px;min-width:160px;padding:3px;background:var(--face);box-shadow:inset -1px -1px 0 var(--dk),inset 1px 1px 0 var(--face),inset -2px -2px 0 var(--sh),inset 2px 2px 0 var(--hi)}
.menu div{height:18px;line-height:18px;padding:0 20px;white-space:nowrap}
.menu .st{font-weight:700}
.menu .off{color:var(--sh);text-shadow:1px 1px 0 var(--hi)}
.menu .on{background:var(--sel);color:#fff}
.menu hr{margin:3px 1px;border:0;border-top:1px solid var(--sh);border-bottom:1px solid var(--hi)}
</style></head><body><div class="screen">
<div class="menu" id="menu">
<div class="st">SWING: 動作中</div>
<hr>
<div class="on" id="open">ダッシュボードを開く</div>
<div>再起動</div>
<div>停止</div>
<div class="off">起動</div>
<hr>
<div>終了</div>
</div>
<div class="taskbar"><span class="start"><i></i>スタート</span>
<span class="tray"><span class="ic"></span><span class="ic net"></span><span class="ic vol"></span>
<span class="sel"><img src="tray-icon.png" alt=""></span>
<span class="clock">21:04</span></span></div>
</div>
</body></html>
